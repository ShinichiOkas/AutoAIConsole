[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoaiconsole"
version = "0.1.0"
description = "Autonomous AI console GUI that drives CLI Coding Agents via child terminal using Ollama"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.0",
    "psutil>=6.0",
]

[project.optional-dependencies]
gui = [
    "pywebview>=5.0",
]
pty = [
    "pywinpty>=2.0; sys_platform == 'win32'",
]

[project.scripts]
autoaiconsole = "autoaiconsole.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autoaiconsole"]
