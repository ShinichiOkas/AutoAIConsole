<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoAIConsole — Autonomous CLI Coding Agent Controller</title>
  <link rel="stylesheet" href="/static/vendor/xterm/xterm.css" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand">
          <span class="brand-logo" aria-hidden="true">⌘</span>
          <span class="brand-name">AutoAIConsole</span>
        </div>
      </div>

      <div class="topbar-center">
        <div id="statusPill" class="status-pill state-idle" role="status" aria-live="polite">
          <span class="pulse-dot"></span>
          <span id="statusLabel" class="status-label">IDLE 待機中</span>
          <span class="status-divider"></span>
          <span id="heartbeatText" class="status-meta">更新: 0秒前</span>
          <span class="status-divider"></span>
          <span id="autoCountText" class="status-meta">自動応答: 0回</span>
        </div>
      </div>

      <div class="topbar-right">
        <div class="model-box" title="Ollama モデル選択 (既定: gemma4:31b-cloud)">
          <span id="ollamaDot" class="conn-dot conn-unknown"></span>
          <select id="modelSelect" aria-label="Ollama モデル">
            <option value="gemma4:31b-cloud">gemma4:31b-cloud ★</option>
          </select>
        </div>

        <div class="segmented" role="group" aria-label="自律モード">
          <button class="seg-btn active" data-mode="autonomous">自律</button>
          <button class="seg-btn" data-mode="paused">一時停止</button>
          <button class="seg-btn" data-mode="manual">手動</button>
        </div>

        <button id="settingsBtn" class="btn btn-ghost btn-icon" title="設定" aria-label="設定">⚙</button>
      </div>
    </header>

    <!-- Main Split Workspace -->
    <main class="workspace" id="workspace">
      <!-- Left Pane: AI Chat & Mission -->
      <section class="pane pane-chat" id="paneChat" aria-label="AIチャット画面">
        <!-- Mission Card -->
        <div class="mission-card" id="missionCard">
          <div class="mission-header">
            <div class="mission-title-group">
              <span class="mission-icon">◎</span>
              <span class="mission-title">現在のミッション（自律判断の基準）</span>
            </div>
            <div class="mission-actions">
              <button id="editMissionBtn" class="btn btn-ghost btn-xs">編集</button>
              <button id="collapseMissionBtn" class="btn btn-ghost btn-xs" aria-expanded="true">折り畳む</button>
            </div>
          </div>
          <div class="mission-body" id="missionBody">
            <div class="mission-row">
              <span class="mission-key">目的</span>
              <span class="mission-val" id="missionGoalView"></span>
            </div>
            <div class="mission-row">
              <span class="mission-key">方針</span>
              <span class="mission-val" id="missionPolicyView"></span>
            </div>
            <div class="mission-row">
              <span class="mission-key">停止境界</span>
              <div class="boundary-tags" id="missionBoundaryView"></div>
            </div>
          </div>
        </div>

        <!-- Chat Timeline -->
        <div class="chat-timeline" id="chatTimeline" role="log" aria-live="polite"></div>

        <!-- Quick Prompt Chips & Composer -->
        <div class="chat-footer">
          <div class="quick-chips">
            <button class="chip" data-prompt="テストが全部通るまで自律で進めておいて">テスト通過まで自律進行</button>
            <button class="chip" data-prompt="今のターミナル画面の状況と進捗を簡潔に要約して">画面状況を要約</button>
            <button class="chip" data-prompt="続けて。確認プロンプトは自律で答えて進めて">自律進行を再開</button>
          </div>
          <div class="composer">
            <textarea id="chatInput" rows="2" placeholder="AutoAI (gemma4:31b-cloud) へ目的・指示・質問を入力... (Enterで送信 / Shift+Enterで改行)"></textarea>
            <button id="sendChatBtn" class="btn btn-primary">送信</button>
          </div>
        </div>
      </section>

      <!-- Resizable Splitter -->
      <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" title="ドラッグして左右幅を調整"></div>

      <!-- Right Pane: Real CLI Terminal (xterm.js + ConPTY) & Live Monitor -->
      <section class="pane pane-terminal" id="paneTerminal" aria-label="子プロセスターミナル画面">
        <!-- Terminal Toolbar -->
        <div class="term-toolbar">
          <div class="term-toolbar-left">
            <select id="agentPreset" class="select-compact" aria-label="CLI Coding Agent プリセット"></select>
            <input id="customCmdInput" class="custom-cmd-input hidden" type="text" placeholder="コマンド例: claude --model sonnet" />
            <div class="cwd-pill" title="作業ディレクトリ">
              <span class="cwd-icon">📁</span>
              <input id="cwdInput" type="text" value="" aria-label="作業ディレクトリ" />
            </div>
          </div>
          <div class="term-toolbar-right">
            <span id="controlBadge" class="control-badge owner-idle">未起動</span>
            <button id="resumeAutoBtn" class="btn btn-emerald btn-xs hidden">自律再開</button>
            <button id="evalNowBtn" class="btn btn-outline btn-xs" title="今のターミナル画面を AutoAI に即時判断させる">今すぐ判断</button>
            <button id="startTermBtn" class="btn btn-primary btn-xs">起動</button>
            <button id="stopTermBtn" class="btn btn-ghost btn-xs hidden">停止</button>
            <button id="ctrlCBtn" class="btn btn-danger-soft btn-xs" title="子プロセスへ Ctrl+C を送信">Ctrl+C</button>
          </div>
        </div>

        <!-- Real xterm.js Terminal Container (Authentic CLI Coding Agent Screen) -->
        <div class="xterm-stage" id="xtermStage">
          <div id="xtermMount" class="xterm-mount"></div>
          <div id="termEmptyOverlay" class="term-empty-overlay">
            <div class="term-empty-box">
              <div class="term-empty-title">CLI Coding Agent ターミナル（実 ConPTY）</div>
              <p class="term-empty-desc">
                右上のプリセット（<code>claude</code> / <code>gemini</code> / <code>agy</code> / <code>pwsh</code> 等）と作業フォルダを選び、<strong>起動</strong>を押すと子プロセスで本物のターミナルが開きます。
              </p>
              <div class="term-empty-actions">
                <button id="quickLaunchClaude" class="btn btn-primary btn-sm">Claude Code を起動</button>
                <button id="quickLaunchGemini" class="btn btn-outline btn-sm">Gemini CLI を起動</button>
                <button id="quickLaunchAgy" class="btn btn-outline btn-sm">agy を起動</button>
                <button id="quickLaunchPwsh" class="btn btn-outline btn-sm">PowerShell を起動</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Compact Live Monitor Strip -->
        <div class="monitor-panel">
          <div class="monitor-strip">
            <div class="monitor-metric">
              <span class="metric-label">監視状態</span>
              <span id="monStateText" class="metric-value">待機中</span>
            </div>
            <div class="monitor-metric">
              <span class="metric-label">無出力経過</span>
              <span id="monSilenceText" class="metric-value mono">0.0s / 2.5s</span>
            </div>
            <div class="monitor-metric metric-grow">
              <span class="metric-label">入力待ち検知</span>
              <div class="confidence-wrap">
                <div class="confidence-track">
                  <div id="monConfBar" class="confidence-fill" style="width: 0%"></div>
                </div>
                <span id="monConfPct" class="metric-value mono">0%</span>
              </div>
            </div>
            <div class="monitor-metric metric-trigger">
              <span class="metric-label">直近の観測・判断</span>
              <span id="monTriggerText" class="metric-value mono truncate">ターミナルを起動すると自律監視が始まります</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Mission Edit Modal -->
  <div id="missionModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="missionModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 id="missionModalTitle">ミッション（自律判断基準）を編集</h2>
        <button class="btn btn-ghost btn-sm modal-close" data-close="missionModal">✕</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>目的 (Goal)</span>
          <textarea id="editGoalInput" rows="2"></textarea>
        </label>
        <label class="field">
          <span>自律回答の方針</span>
          <textarea id="editPolicyInput" rows="2"></textarea>
        </label>
        <label class="field">
          <span>停止境界条件（カンマ区切り）</span>
          <input id="editBoundariesInput" type="text" />
        </label>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-close="missionModal">キャンセル</button>
        <button id="saveMissionBtn" class="btn btn-primary">ミッションを更新</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 id="settingsModalTitle">AutoAIConsole 設定</h2>
        <button class="btn btn-ghost btn-sm modal-close" data-close="settingsModal">✕</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>Ollama Base URL</span>
          <div class="field-row">
            <input id="ollamaUrlInput" type="text" value="http://127.0.0.1:11434" />
            <button id="refreshModelsBtn" class="btn btn-outline btn-sm">モデル再取得</button>
          </div>
          <small id="ollamaStatusNote" class="field-hint">接続状態を確認中...</small>
        </label>

        <label class="field">
          <span>既定モデル（推奨: gemma4:31b-cloud）</span>
          <select id="settingsModelSelect"></select>
        </label>

        <label class="field">
          <span>プロンプト検知の無出力閾値: <strong id="idleThresholdVal">2.5秒</strong></span>
          <input id="idleThresholdRange" type="range" min="1.0" max="10.0" step="0.5" value="2.5" />
          <small class="field-hint">この時間だけターミナル出力が止まると、AutoAI が画面を読み取り自律回答すべきか判定します。</small>
        </label>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-close="settingsModal">閉じる</button>
        <button id="saveSettingsBtn" class="btn btn-primary">設定を適用</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="/static/vendor/xterm/xterm.js"></script>
  <script src="/static/vendor/xterm/addon-fit.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
